name: LR6 Telegram smoke test
'on':
  push:
    branches:
    - lr6-telegram-smoke
jobs:
  sanity_check:
    runs-on: ubuntu-latest
    steps:
    - run: exit 1
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - run: exit 0
    needs: sanity_check
  build_game:
    runs-on: ubuntu-latest
    steps:
    - run: exit 0
    needs: run_tests
  mirror_repo:
    runs-on: ubuntu-latest
    steps:
    - run: exit 0
    needs: build_game
  build_docker_image:
    runs-on: ubuntu-latest
    steps:
    - run: exit 0
    needs: mirror_repo
  deploy_to_pages:
    runs-on: ubuntu-latest
    steps:
    - run: exit 0
    needs: build_docker_image
  notify:
    needs:
    - sanity_check
    - run_tests
    - build_game
    - mirror_repo
    - build_docker_image
    - deploy_to_pages
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Determine pipeline status
      id: status
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: "stage=none\nfor job in sanity_check run_tests build_game mirror_repo \\\n           build_docker_image deploy_to_pages; do\n  result=$(jq -er --arg job \"$job\" '.[$job].result' <<< \"$RESULTS\")\n  if [[ \"$result\" != success ]]; then\n    stage=$job\n    break\n  fi\ndone\necho \"stage=$stage\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Send Telegram notification
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        STAGE: ${{ steps.status.outputs.stage }}
        SITE_URL: https://maximusgeng.github.io/ARPO/
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
      run: "if [[ -z \"$BOT_TOKEN\" || -z \"$CHAT_ID\" ]]; then\n  echo \"::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID\"\n  exit 1\nfi\n\nif [[ \"$STAGE\" == none ]]; then\n  printf -v message 'Сборка ARPO завершена успешно.\\nАвтор: %s\\nИгра: %s\\nПрогон: %s' \\\n    \"$AUTHOR\" \"$SITE_URL\" \"$RUN_URL\"\nelse\n  printf -v message 'Сборка ARPO остановилась на задаче %s.\\nАвтор: %s\\nЛог: %s' \\\n    \"$STAGE\" \"$AUTHOR\" \"$RUN_URL\"\nfi\n\npayload=$(jq -n --arg chat_id \"$CHAT_ID\"\
        \ --arg text \"$message\" \\\n  '{chat_id: $chat_id, text: $text}')\nif ! response=$(curl --silent --fail --max-time 20 \\\n  --request POST --header 'Content-Type: application/json' \\\n  --data-binary \"$payload\" \\\n  \"https://api.telegram.org/bot${BOT_TOKEN}/sendMessage\"); then\n  echo \"::error::Telegram sendMessage request failed\"\n  exit 1\nfi\njq -e '.ok == true' <<< \"$response\" > /dev/null\n"
