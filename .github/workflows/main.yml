# Название всего автоматического процесса
name: Unity 2D Platformer CI/CD

# Проверка push и pull request для ветки main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ЗАДАЧА 1: Быстрая диагностика структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest # Запуск на бесплатном облачном сервере Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Скачиваем код проекта на облачный сервер

      - name: Check Unity Directories
        run: |
          echo "=== Проверка наличия метаданных Unity ==="
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

      - name: Locate 2D Platformer Scripts
        run: |
          echo "=== Поиск C# скриптов в папке Assets ==="
          find Assets/ -name "*Controller.cs" -print
          find Assets/ -name "BuildManager.cs" -print

  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "${missing:-0}"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-6000.6.0f1-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Install GameCI CLI
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run Unity tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci test --docker --dockerShmSize=1025m \
            --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
            --engineVersion=6000.6.0f1 --coverageEnabled=false \
            --artifactsPath=artifacts --dockerIsolationMode=default \
            --containerRegistryRepository=unityci/editor \
            --containerRegistryImageVersion=3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/

  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache WebGL Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-6000.6.0f1-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 6000.6.0f1
          buildMethod: BuildManager.BuildWebGL

      - name: Verify WebGL output
        run: |
          test -s Builds/WebGL/index.html
          for suffix in data framework.js wasm; do
            for file in Builds/WebGL/Build/*."$suffix".unityweb; do
              gzip -t "$file"
            done
          done

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL
          if-no-files-found: error


  # ЗАДАЧА 2: Автоматическое зеркалирование в резервный репозиторий
  mirror_repo:
    needs: run_tests
    if: github.event_name == 'push' && github.repository == 'maximusgeng/ARPO'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем полную историю коммитов для корректного зеркалирования
          persist-credentials: false # Отключаем credential helper — чтобы GITHUB_TOKEN не перекрывал PAT

      - name: Verify token is set
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "=== ОШИБКА: BACKUP_TOKEN is empty! Create a PAT with scopes [repo, workflow] ==="
            exit 1
          else
            echo "=== BACKUP_TOKEN is set (length: ${#BACKUP_TOKEN}) ==="
          fi

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "=== Начало процесса зеркалирования ==="
          git push --force https://x-access-token:${BACKUP_TOKEN}@github.com/maximusgeng/ARPO_backup.git main
          echo "=== Код успешно продублирован ==="

  # НОВЫЙ ЭТАП 3: Автоматическая сборка Docker-образа в облако
  build_docker_image:
    needs: build_game
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # КРИТИЧЕСКИ ВАЖНЫЕ СТРОКИ: Разрешаем этой конкретной задаче публиковать пакеты
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Системный автоматический токен GitHub

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/maximusgeng/arpo:latest
            ghcr.io/maximusgeng/arpo:${{ github.sha }}

  deploy_to_pages:
    needs: build_game
    if: github.event_name == 'push' && github.repository == 'maximusgeng/ARPO'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WebGL build
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs:
      - sanity_check
      - run_tests
      - build_game
      - mirror_repo
      - build_docker_image
      - deploy_to_pages
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Determine pipeline status
        id: status
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          stage=none
          for job in sanity_check run_tests build_game mirror_repo \
                     build_docker_image deploy_to_pages; do
            result=$(jq -er --arg job "$job" '.[$job].result' <<< "$RESULTS")
            if [[ "$result" != success ]]; then
              stage=$job
              break
            fi
          done
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: https://maximusgeng.github.io/ARPO/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          if [[ -z "$BOT_TOKEN" || -z "$CHAT_ID" ]]; then
            echo "::error::Configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID"
            exit 1
          fi

          if [[ "$STAGE" == none ]]; then
            printf -v message 'Сборка ARPO завершена успешно.\nАвтор: %s\nИгра: %s\nПрогон: %s' \
              "$AUTHOR" "$SITE_URL" "$RUN_URL"
          else
            printf -v message 'Сборка ARPO остановилась на задаче %s.\nАвтор: %s\nЛог: %s' \
              "$STAGE" "$AUTHOR" "$RUN_URL"
          fi

          payload=$(jq -n --arg chat_id "$CHAT_ID" --arg text "$message" \
            '{chat_id: $chat_id, text: $text}')
          if ! response=$(curl --silent --fail --max-time 20 \
            --request POST --header 'Content-Type: application/json' \
            --data-binary "$payload" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"); then
            echo "::error::Telegram sendMessage request failed"
            exit 1
          fi
          jq -e '.ok == true' <<< "$response" > /dev/null
